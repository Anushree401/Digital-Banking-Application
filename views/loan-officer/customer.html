<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Customer Details - BrokeBank</title>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">SecureBank</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="applications.html" class="nav-link">Loan Applications</a></li>
            <li class="nav-item"><a href="kyc.html" class="nav-link">KYC Verification</a></li>
            <li class="nav-item"><a href="customer.html" class="nav-link active">Customer Details</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Customer Profile</h1>
            <div class="user-profile">
                <div class="officer-meta">
                    <div class="officer-name">Sarah Johnson</div>
                    <div class="officer-role">Loan Officer</div>
                </div>
                <img src="https://ui-avatars.com/api/?name=Sarah+Johnson" alt="Profile">
            </div>
        </header>

        <div class="details-grid">
            <div class="card">
                <h3>Personal Information</h3><br>
                <div class="info-item"><span class="label">Selected Customer</span><span class="value" id="custName">--</span></div>
                <div class="info-item"><span class="label">Email</span><span class="value" id="custEmail">--</span></div>
                <div class="info-item"><span class="label">Phone</span><span class="value" id="custPhone">--</span></div>
                <div class="info-item"><span class="label">KYC Status</span><span class="value value-success" id="custKyc">--</span></div>
            </div>
            <div class="card">
                <h3>Account Summary</h3><br>
                <div class="info-item"><span class="label">Primary Account</span><span class="value" id="custAccount">--</span></div>
                <div class="info-item"><span class="label">Current Balance</span><span class="value" id="custBalance">--</span></div>
                <div class="info-item"><span class="label">Active Loans</span><span class="value" id="custLoans">--</span></div>
                <div class="info-item"><span class="label">Risk Profile</span><span class="value" id="custRisk">--</span></div>
            </div>
        </div>
    </main>
    <script src="../../middleware/loan-officer/customers.js"></script>
</body>
</html>
