<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Loan Applications - BrokeBank</title>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">SecureBank</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="applications.html" class="nav-link active">Loan Applications</a></li>
            <li class="nav-item"><a href="kyc.html" class="nav-link">KYC Verification</a></li>
            <li class="nav-item"><a href="customer.html" class="nav-link">Customer Details</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Loan Applications</h1>
            <div class="user-profile">
                <div class="officer-meta">
                    <div class="officer-name">Sarah Johnson</div>
                    <div class="officer-role">Loan Officer</div>
                </div>
                <img src="https://ui-avatars.com/api/?name=Sarah+Johnson" alt="Profile">
            </div>
        </header>

        <div class="card table-wrap">
            <div class="table-header">
                <h3>Pending Applications</h3>
                <div>
                    <button class="btn">Filter</button>
                    <button class="btn">Export</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Loan ID</th>
                        <th>Customer Name</th>
                        <th>Loan Type</th>
                        <th>Amount</th>
                        <th>Applied Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="loanApplicationsBody"></tbody>
            </table>
        </div>
    </main>
    <script src="../../middleware/loan-officer/applications.js"></script>
</body>
</html>
