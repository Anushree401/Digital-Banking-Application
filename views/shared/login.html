<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | BrokeBank</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body class="login-layout">

<!-- LEFT PANEL -->

<div class="login-brand">

<div class="brand-top">
<img src="assets/brokebank_logo.png" alt="BrokeBank logo">
<span>BrokeBank</span>
</div>

<div class="brand-content">

<h1>Welcome to BrokeBank</h1>

<p>
Smart, secure and simple digital banking.
Access your account and manage your finances anywhere.
</p>

</div>

</div>

<!-- RIGHT PANEL -->

<div class="login-panel">

<div class="login-box">

<h2>Sign In</h2>

<p class="login-desc">
Enter your email and password to continue
</p>

<form action="/auth/login" method="POST" class="login-form">

<label>Email Address</label>
<input type="email" name="email" placeholder="you@example.com" required>

<label>Password</label>
<input type="password" name="password" placeholder="••••••••" required>

<div class="login-options">

<label>
<input type="checkbox"> Remember me
</label>

<a href="../customer/support.html">Forgot password?</a>

</div>

<button type="submit">Login</button>

<p id="error-message"></p>

<div id="g_id_onload"
     data-client_id="310121859260-prml55ll4ug7p15li385fd2r2vr7cims.apps.googleusercontent.com"
     data-callback="handleGoogleLogin">
</div>

<div class="g_id_signin"></div>

</form>

<p class="register-link">
Don't have an account?
<a href="regi_choice.html">Register</a>
</p>

</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const error = params.get("error");

if (error) {
document.getElementById("error-message").innerText =
"Invalid email or password";
}
</script>

<script>
document.querySelector('.login-form').addEventListener('submit', function(e) {
    const email = document.querySelector('[name="email"]').value.trim();
    const password = document.querySelector('[name="password"]').value.trim();
    const errorBox = document.getElementById('error-message');
    document.getElementById('email').style.borderColor = 'red'; 

    errorBox.innerText = '';

    // Email validation
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!emailValid) {
        e.preventDefault();
        errorBox.innerText = "Enter a valid email address";
        return;
    }

    // Password validation
    if (password.length < 6) {
        e.preventDefault();
        errorBox.innerText = "Password must be at least 6 characters";
        return;
    }
});
</script>

<script>
function handleGoogleLogin(response) {
    console.log("Google JWT:", response.credential);

    // send to backend
    fetch('/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: response.credential })
    })
    .then(res => res.json())
    .then(data => {
        window.location.href = data.redirect;
    })
    .catch(err => console.error(err));
}
</script>

</body>
</html>
