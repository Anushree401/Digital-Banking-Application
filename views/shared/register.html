<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - BrokeBank</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<style>


.register-container{
max-width:900px;
margin:60px auto;
padding:40px;

background:white;
border-radius:18px;
border:1px solid var(--surface);

box-shadow:0 20px 50px rgba(0,0,0,0.06);
}


.register-header{
text-align:center;
margin-bottom:30px;
}

.register-header h1{
color:var(--primary);
margin-bottom:8px;
}

.register-header p{
color:#666;
}

.section-title{
margin:30px 0 15px;
font-size:18px;
font-weight:600;
color:var(--primary);
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.full-width{
grid-column:span 2;
}


.form-group{
display:flex;
flex-direction:column;
}

.form-group label{
margin-bottom:6px;
font-size:14px;
color:#444;
}

.form-group input,
.form-group select{
padding:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
transition:0.2s;
}

.form-group input:focus,
.form-group select:focus{
outline:none;
border-color:var(--primary);
}

.submit-btn{
margin-top:30px;
width:100%;

background:var(--primary);
color:white;

padding:14px;
border:none;
border-radius:10px;

font-size:16px;
cursor:pointer;
transition:0.2s;
}

.submit-btn:hover{
background:var(--accent);
transform:translateY(-1px);
}

.register-brand{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin:20px auto 0;
font-weight:800;
letter-spacing:0.02em;
color:var(--primary);
}

.register-brand img{
width:34px;
height:34px;
}

</style>

</head>

<body>

<header></header>
<nav></nav>

<div class="register-brand">
<img src="assets/brokebank_logo.svg" alt="BrokeBank logo">
<span>BrokeBank</span>
</div>

<main>

<div class="register-container">

<div class="register-header">
<h1 id="registerTitle">Customer Registration</h1>
<p id="registerDesc">Fill in your details to create an account</p>
</div>

<form action="/auth/register" method="POST">

    <p id="formError" style="color:red; margin-bottom:10px;"></p>

<input type="hidden" id="roleInput" name="role" value="customer">


<div class="section-title">Personal Information</div>

<div class="form-grid">

<div class="form-group">
<label for="fname">First Name</label>
<input type="text" id="fname" name="fname" title="First Name" required>
</div>

<div class="form-group">
<label for="lname">Last Name</label>
<input type="text" id="lname" name="lname" title="Last Name" required>
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" title="Email Address" required>
</div>

<div class="form-group">
<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" title="Phone Number" required>
</div>

<div class="form-group full-width">
<label for="password">Password</label>
<input type="password" id="password" name="password" title="Password" required>
<small id="passStrength" style="margin-top:5px;"></small>
</div>

<div id="otpSection" style="display:none; margin-top:20px;">
    <label>Enter OTP</label>
    <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">

    <button type="button" id="verifyOtpBtn" class="submit-btn" style="margin-top:10px;">
        Verify OTP
    </button>
</div>

<div class="form-group full-width">
<label for="customerType">Customer Type</label>
<select id="customerType" name="customerType" title="Customer Type">
<option value="individual">Individual</option>
<option value="business">Business</option>
</select>
</div>

</div>


<div class="section-title">KYC Information</div>

<div class="form-grid">

<div class="form-group">
<label>PAN Number</label>
<input type="text" name="pan" placeholder="ABCDE1234F">
</div>

<div class="form-group">
<label>Aadhaar Number</label>
<input type="text" name="aadhaar" placeholder="1234 5678 9012">
</div>

</div>


<div class="section-title">Additional Details</div>

<div class="form-grid">

<div class="form-group">
<label for="dob">Date of Birth</label>
<input type="date" id="dob" name="dob" title="Date of Birth">
</div>

<div class="form-group">
<label for="occupation">Occupation</label>
<input type="text" id="occupation" name="occupation" title="Occupation">
</div>

</div>

<button type="submit" class="submit-btn">
Create Account
</button>

</form>

</div>

</main>

<footer></footer>
<script>
// Handle role parameter from URL
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    
    const roleMapping = {
        'customer': { title: 'Customer Registration', desc: 'Fill in your details to create an account' },
        'officer': { title: 'Loan Officer Registration', desc: 'Complete your registration as a loan officer' },
        'investor': { title: 'Investor Registration', desc: 'Register as an investor' }
    };
    
    if (role && roleMapping[role]) {
        document.getElementById('roleInput').value = role;
        document.getElementById('registerTitle').textContent = roleMapping[role].title;
        document.getElementById('registerDesc').textContent = roleMapping[role].desc;
    }
});
</script>
<script src="../../middleware/shared/main.js"></script>
<script>
let formRef = null;

document.querySelector('form').addEventListener('submit', async function(e) {

    e.preventDefault(); 
    formRef = this;

    const fname = document.getElementById('fname').value.trim();
    const lname = document.getElementById('lname').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value.trim();
    const pan = document.querySelector('[name="pan"]').value.trim();
    const aadhaar = document.querySelector('[name="aadhaar"]').value.trim();

    const errorBox = document.getElementById('formError');
    errorBox.innerText = '';

    // VALIDATIONS
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!emailValid) {
        errorBox.innerText = "Invalid email";
        return;
    }

    const phoneValid = /^[6-9]\d{9}$/.test(phone);
    if (!phoneValid) {
        errorBox.innerText = "Invalid phone number";
        return;
    }

    if (password.length < 6) {
        errorBox.innerText = "Password must be at least 6 characters";
        return;
    }

    if (pan && !/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan)) {
        errorBox.innerText = "Invalid PAN format";
        return;
    }

    if (aadhaar && !/^\d{12}$/.test(aadhaar.replace(/\s/g,''))) {
        errorBox.innerText = "Invalid Aadhaar number";
        return;
    }

    try {
        // SEND OTP
        await fetch('/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        // SHOW OTP SECTION
        document.getElementById('otpSection').style.display = 'block';

        errorBox.innerText = "OTP sent to your email";

    } catch (err) {
        console.error(err);
        errorBox.innerText = "Failed to send OTP";
    }

});


document.getElementById('verifyOtpBtn').addEventListener('click', async function() {

    const otp = document.getElementById('otpInput').value.trim();
    const email = document.getElementById('email').value.trim();
    const errorBox = document.getElementById('formError');

    if (!otp) {
        errorBox.innerText = "Enter OTP";
        return;
    }

    try {
        const res = await fetch('/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ otp, email })
        });

        const data = await res.json();

        if (!res.ok) {
            errorBox.innerText = "Invalid OTP";
            return;
        }

        formRef.submit();

    } catch (err) {
        console.error(err);
        errorBox.innerText = "Verification failed";
    }
});
</script>
<script>
document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const strength = document.getElementById('passStrength');

    if (val.length === 0) {
        strength.innerText = '';
        return;
    }

    if (val.length < 6) {
        strength.innerText = "Weak";
        strength.style.color = "red";
    } 
    else if (/[A-Z]/.test(val) && /\d/.test(val)) {
        strength.innerText = "Strong";
        strength.style.color = "green";
    } 
    else {
        strength.innerText = "Medium";
        strength.style.color = "orange";
    }
});
</script>
</body>
</html>
